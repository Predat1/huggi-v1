# Render Blueprint — Huggy v1
# Deploy: Connect this repo on https://dashboard.render.com → New → Blueprint
# Render auto-detects this file and provisions all services.

services:
  - type: web
    name: huggy-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter         # $7/month — 512MB RAM, shared CPU (upgrade to Standard for production)
    region: frankfurt     # EU — closest to your users
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: SITES_DIR
        value: /data/sites
      - key: ANTHROPIC_API_KEY
        sync: false       # Set manually in Render dashboard (secret)
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false       # Set to your Render URL: https://huggy-api.onrender.com
    disk:
      name: huggy-sites
      mountPath: /data/sites
      sizeGB: 1           # Persistent disk for deployed user sites
